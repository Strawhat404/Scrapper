services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: social-pulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialpulse
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d socialpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  # Note: Backend runs locally on your machine (not in Docker)
  # Make sure to start it with: cd backend && npm run start:dev
  frontend:
    build:
      context: ./social-pulse-dashboard
      dockerfile: Dockerfile
    container_name: social-pulse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    # Frontend will connect to backend at http://localhost:3000 (running on host machine)

# ============================================
# Volumes (Persistent Data)
# ============================================
volumes:
  postgres_data:
    driver: local
